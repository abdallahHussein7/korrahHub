<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoraHub - Book • Play • Enjoy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #060d0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .loginPage{
                color: #000;
    text-decoration: none;
    font-size: 21px;
    background-color: #fff;
    border-radius: 20px;
    font-weight: bold;
    padding: 2px 15px;
    font-style: italic;
        }

        .phone-screen {
            position: relative;
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-color: #091711;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .stadium-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                linear-gradient(
                    180deg,
                    #05110c 0%,
                    #081c14 38%,
                    rgba(12, 46, 30, 0.78) 58%,
                    rgba(18, 92, 42, 0.55) 76%,
                    rgba(26, 138, 52, 0.75) 100%
                );
        }

        .stadium-lines {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.45;
            background:
                radial-gradient(circle at 22% 54%, rgba(210, 255, 235, 0.22) 0%, transparent 14%),
                radial-gradient(circle at 78% 54%, rgba(210, 255, 235, 0.22) 0%, transparent 14%),
                linear-gradient(90deg, transparent 49.5%, rgba(255, 255, 255, 0.35) 50%, transparent 50.5%),
                linear-gradient(180deg, transparent 62%, rgba(255, 255, 255, 0.25) 62.4%, transparent 63%);
        }

        .pitch-turf {
            position: absolute;
            left: -15%;
            right: -15%;
            bottom: -10%;
            height: 36%;
            z-index: 1;
            border-top-left-radius: 50% 24%;
            border-top-right-radius: 50% 24%;
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(56, 189, 72, 0.28) 0px,
                    rgba(56, 189, 72, 0.28) 28px,
                    rgba(22, 110, 42, 0.28) 28px,
                    rgba(22, 110, 42, 0.28) 56px
                ),
                linear-gradient(180deg, #279c3e 0%, #166e2a 100%);
            box-shadow: inset 0 6px 20px rgba(163, 255, 178, 0.22);
        }

        .brand-header {
            position: relative;
            z-index: 2;
            margin-top: 115px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeDown 0.8s ease-out;
        }

        .logo-wrapper {
            position: relative;
            width: 112px;
            height: 76px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
        }

        .speed-lines {
            position: absolute;
            left: 2px;
            width: 52px;
            height: 54px;
            z-index: 1;
        }

        .speed-lines span {
            position: absolute;
            left: 0;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(74, 222, 128, 0.15), #4ade80);
            transform: skewX(-24deg);
        }

        .speed-lines span:nth-child(1) {
            top: 8px;
            width: 34px;
            left: 10px;
        }

        .speed-lines span:nth-child(2) {
            top: 18px;
            width: 44px;
            left: 4px;
        }

        .speed-lines span:nth-child(3) {
            top: 28px;
            width: 48px;
            left: 0px;
        }

        .speed-lines span:nth-child(4) {
            top: 38px;
            width: 38px;
            left: 6px;
        }

        .top-ball {
            position: relative;
            z-index: 2;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .brand-name {
            font-size: 38px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: -0.5px;
            line-height: 1.05;
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
        }

        .brand-name .kora {
            color: #ffffff;
        }

        .brand-name .hub {
            color: #55d65c;
        }

        .tagline {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #e8f5ee;
            letter-spacing: 0.4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .hero-ball-area {
            position: relative;
            z-index: 2;
            margin-bottom: 135px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatBall 2.8s ease-in-out infinite;
        }

        .hero-ball {
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f1f5f9 55%, #cbd5e1 100%);
            box-shadow:
                0 18px 28px rgba(0, 0, 0, 0.55),
                inset -8px -10px 16px rgba(15, 23, 42, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .ball-shadow {
            width: 96px;
            height: 18px;
            margin-top: 10px;
            border-radius: 50%;
            background: rgba(3, 20, 9, 0.65);
            filter: blur(4px);
        }

        .bottom-indicator {
            position: absolute;
            bottom: 10px;
            z-index: 3;
            width: 122px;
            height: 4px;
            border-radius: 999px;
            background-color: #6ce575;
            box-shadow: 0 0 10px rgba(108, 229, 117, 0.6);
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatBall {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }
    </style>
</head>
<body>

    <div class="phone-screen">
        <div class="stadium-bg"></div>
        <div class="stadium-lines"></div>
        <div class="pitch-turf"></div>

        <div class="brand-header">
            <div class="logo-wrapper">
                <div class="speed-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="top-ball">
                    <svg viewBox="0 0 100 100" width="62" height="62">
                        <circle cx="50" cy="50" r="46" fill="#ffffff" stroke="#111827" stroke-width="3"/>
                        <polygon points="50,28 67,40 61,60 39,60 33,40" fill="#111827"/>
                        <polygon points="50,4 62,15 50,28 38,15" fill="#111827"/>
                        <polygon points="92,38 82,53 67,40 74,25" fill="#111827"/>
                        <polygon points="76,88 59,82 61,60 77,66" fill="#111827"/>
                        <polygon points="24,88 23,66 39,60 41,82" fill="#111827"/>
                        <polygon points="8,38 26,25 33,40 18,53" fill="#111827"/>
                    </svg>
                </div>
            </div>

            <div class="brand-name">
                <span class="kora">Kora</span><span class="hub">Hub</span>
            </div>
            <p class="tagline">Book &bull; Play &bull; Enjoy</p>
        </div>

        <div class="hero-ball-area">
            <div class="hero-ball">
                <svg viewBox="0 0 100 100" width="118" height="118">
                    <circle cx="50" cy="50" r="47" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
                    <polygon points="50,27 68,40 61,62 39,62 32,40" fill="#111827"/>
                    <polygon points="50,3 63,14 50,27 37,14" fill="#111827"/>
                    <polygon points="94,37 83,54 68,40 76,24" fill="#111827"/>
                    <polygon points="77,90 59,83 61,62 78,68" fill="#111827"/>
                    <polygon points="23,90 22,68 39,62 41,83" fill="#111827"/>
                    <polygon points="6,37 24,24 32,40 17,54" fill="#111827"/>
                </svg>
            </div>
            <div class="ball-shadow"></div>

            <a class="loginPage" href="login.html"> Login </a>

        </div>

        <div class="bottom-indicator"></div>
    </div>

</body>
</html>
