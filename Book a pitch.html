<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoraHub - Book a Pitch</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #e5e9e7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .booking-screen {
            position: relative;
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            max-height: 844px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.16);
        }

        .stadium-banner {
            position: relative;
            width: 100%;
            height: 175px;
            background:
                radial-gradient(circle at 20% 34%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.25) 8%, transparent 18%),
                radial-gradient(circle at 48% 30%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.2) 7%, transparent 16%),
                radial-gradient(circle at 78% 34%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.25) 8%, transparent 18%),
                linear-gradient(180deg, #072419 0%, #0e3b28 45%, #195938 62%, #24963c 64%, #146929 100%);
            overflow: hidden;
        }

        .banner-turf-lines {
            position: absolute;
            left: 0;
            right: 0;
            top: 64%;
            bottom: 0;
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.05) 0px,
                    rgba(255, 255, 255, 0.05) 24px,
                    rgba(0, 0, 0, 0.06) 24px,
                    rgba(0, 0, 0, 0.06) 48px
                );
        }

        .banner-turf-lines::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1.5px;
            background: rgba(255, 255, 255, 0.65);
        }

        .banner-topbar {
            position: relative;
            z-index: 3;
            padding: 20px 18px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(8, 28, 19, 0.35);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        .screen-heading {
            font-size: 17px;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        }

        .badge-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            background-color: #15803d;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .badge-btn svg {
            width: 16px;
            height: 16px;
        }

        .booking-sheet {
            position: relative;
            z-index: 4;
            margin-top: -20px;
            flex: 1;
            background-color: #ffffff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 22px 20px 26px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
        }

        .pitch-title {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 18px;
        }

        .block-label {
            font-size: 14.5px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 12px;
        }

        .dates-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .dates-row::-webkit-scrollbar {
            display: none;
        }

        .date-card {
            min-width: 72px;
            height: 78px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.18s ease;
        }

        .date-card .day-name {
            font-size: 12.5px;
            font-weight: 500;
            color: #4b5563;
        }

        .date-card .day-num {
            font-size: 18px;
            font-weight: 700;
            color: #111827;
        }

        .date-card.active {
            background-color: #ccefd6;
            border-color: #22a347;
        }

        .date-card.active .day-name,
        .date-card.active .day-num {
            color: #0f3d1e;
        }

        .time-section {
            margin-top: 22px;
        }

        .slots-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .time-slot {
            flex: 1;
            min-width: 96px;
            height: 44px;
            border-radius: 11px;
            border: 1px solid #e2e8e5;
            background-color: #f8faf9;
            color: #111827;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .time-slot.active {
            background-color: #147a32;
            border-color: #147a32;
            color: #ffffff;
            box-shadow: 0 6px 14px rgba(20, 122, 50, 0.24);
        }

        .booking-summary {
            margin-top: 14px;
            font-size: 12.5px;
            color: #147a32;
            font-weight: 600;
            min-height: 18px;
        }

        .confirm-btn {
            margin-top: 18px;
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(180deg, #1d8a39 0%, #116628 100%);
            color: #ffffff;
            font-size: 15.5px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(17, 102, 40, 0.28);
            transition: transform 0.15s ease, filter 0.2s ease;
        }

        .confirm-btn:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="booking-screen">
        <div>
            <div class="stadium-banner">
                <div class="banner-turf-lines"></div>
                <div class="banner-topbar">
                    <a href="pitch-details.html" class="icon-btn" aria-label="Back to Pitch Details">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </a>

                    <span class="screen-heading">Book a Pitch</span>

                    <button type="button" class="badge-btn" aria-label="Pitch icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <circle cx="12" cy="12" r="7"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="booking-sheet">
                <div>
                    <h1 class="pitch-title">Dream Arena</h1>

                    <div class="block-label">Select Date</div>
                    <div class="dates-row" id="datesRow">
                        <button type="button" class="date-card" data-date="Tue 22" onclick="selectDate(this, 'Tue 22')">
                            <span class="day-name">Tue</span>
                            <span class="day-num">22</span>
                        </button>
                        <button type="button" class="date-card active" data-date="Wed 23" onclick="selectDate(this, 'Wed 23')">
                            <span class="day-name">Wed</span>
                            <span class="day-num">23</span>
                        </button>
                        <button type="button" class="date-card" data-date="Thu 24" onclick="selectDate(this, 'Thu 24')">
                            <span class="day-name">Thu</span>
                            <span class="day-num">24</span>
                        </button>
                        <button type="button" class="date-card" data-date="Fri 25" onclick="selectDate(this, 'Fri 25')">
                            <span class="day-name">Fri</span>
                            <span class="day-num">25</span>
                        </button>
                        <button type="button" class="date-card" data-date="Sat 26" onclick="selectDate(this, 'Sat 26')">
                            <span class="day-name">Sat</span>
                            <span class="day-num">26</span>
                        </button>
                    </div>

                    <div class="time-section">
                        <div class="block-label">Select Time</div>
                        <div class="slots-row" id="slotsRow">
                            <button type="button" class="time-slot" data-time="5:00 PM" onclick="selectTime(this, '5:00 PM')">5:00 PM</button>
                            <button type="button" class="time-slot active" data-time="6:00 PM" onclick="selectTime(this, '6:00 PM')">6:00 PM</button>
                            <button type="button" class="time-slot" data-time="7:00 PM" onclick="selectTime(this, '7:00 PM')">7:00 PM</button>
                        </div>
                    </div>

                    <div class="booking-summary" id="bookingSummary">Selected: Wed 23 • 6:00 PM</div>
                </div>

                <button type="button" class="confirm-btn" onclick="confirmBooking()">Confirm Booking</button>
            </div>
        </div>
    </div>

    <script>
        let selectedDate = "Wed 23";
        let selectedTime = "6:00 PM";

        function updateSummary() {
            document.getElementById("bookingSummary").textContent =
                `Selected: ${selectedDate} • ${selectedTime}`;
        }

        function selectDate(card, dateVal) {
            selectedDate = dateVal;
            document.querySelectorAll(".date-card").forEach(item => item.classList.remove("active"));
            card.classList.add("active");
            updateSummary();
        }

        function selectTime(slot, timeVal) {
            selectedTime = timeVal;
            document.querySelectorAll(".time-slot").forEach(item => item.classList.remove("active"));
            slot.classList.add("active");
            updateSummary();
        }

        function confirmBooking() {
            window.location.href = "split-payment.html";
        }
    </script>

</body>
</html>
